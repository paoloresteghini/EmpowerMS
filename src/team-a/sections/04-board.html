<!-- PLACEHOLDER: same monogram discs as the fellows, at the size a board roll
     needs. Names and the two officer roles are the roadmap’s copy. Grant Callen
     appears here and in the staff roster because he sits on both. -->
<section class="ta-board" aria-labelledby="board-title">
  <div class="ta-board__grid em-container">
    <div class="ta-board__head ta-mark" data-reveal-group>
      <h2 id="board-title" data-reveal="rise">Board of Directors</h2>
    </div>

    <ul class="ta-roll" data-reveal-group>
      <li class="ta-roll__item" data-reveal="rise">
        <span class="ta-disc ta-disc--roll" data-placeholder="headshot" aria-hidden="true">AP</span>
        <span class="ta-roll__name">Abb Payne</span>
        <span class="ta-roll__role">Chairman</span>
      </li>
      <li class="ta-roll__item" data-reveal="rise">
        <span class="ta-disc ta-disc--roll" data-placeholder="headshot" aria-hidden="true">GG</span>
        <span class="ta-roll__name">Gerard Gibert</span>
        <span class="ta-roll__role">Treasurer</span>
      </li>
      <li class="ta-roll__item" data-reveal="rise">
        <span class="ta-disc ta-disc--roll" data-placeholder="headshot" aria-hidden="true">GC</span>
        <span class="ta-roll__name">Grant Callen</span>
      </li>
      <li class="ta-roll__item" data-reveal="rise">
        <span class="ta-disc ta-disc--roll" data-placeholder="headshot" aria-hidden="true">SD</span>
        <span class="ta-roll__name">Sunny Desai</span>
      </li>
      <li class="ta-roll__item" data-reveal="rise">
        <span class="ta-disc ta-disc--roll" data-placeholder="headshot" aria-hidden="true">BD</span>
        <span class="ta-roll__name">Betsy Dowell</span>
      </li>
      <li class="ta-roll__item" data-reveal="rise">
        <span class="ta-disc ta-disc--roll" data-placeholder="headshot" aria-hidden="true">LL</span>
        <span class="ta-roll__name">Lex Lindsey</span>
      </li>
      <li class="ta-roll__item" data-reveal="rise">
        <span class="ta-disc ta-disc--roll" data-placeholder="headshot" aria-hidden="true">MS</span>
        <span class="ta-roll__name">Marie Sanderson</span>
      </li>
      <li class="ta-roll__item" data-reveal="rise">
        <span class="ta-disc ta-disc--roll" data-placeholder="headshot" aria-hidden="true">GW</span>
        <span class="ta-roll__name">George Williams</span>
      </li>
    </ul>
  </div>
</section>
