<!-- The roadmap’s Meaningful Work tab gives the hero one line and nothing else:
     "Hero: Work Should Open Doors to Opportunity". No subhead, no CTA. So the
     photograph carries the rest of the screen rather than a paragraph nobody
     has written yet. The word "Meaningful Work" above the headline is the page
     title, not invented copy.

     No text sits on the photograph. -->
<section class="wra-hero" aria-labelledby="hero-title" data-reveal-entrance>
  <div class="em-container">
    <div class="wra-hero__inner">
      <div class="wra-hero__copy">
        <p class="wra-hero__eyebrow" data-reveal="rise">Meaningful Work</p>
        <h1 id="hero-title" data-reveal="rise">Work Should Open Doors to <em>Opportunity</em></h1>
      </div>
    </div>
  </div>

  <figure class="wra-hero__media" data-reveal="clip">
    <img src="../assets/photography/worker-workshop-bw.jpg" alt="A young man working at a computer in an open-plan office" width="918" height="620" fetchpriority="high" decoding="async">
  </figure>
</section>
