<!-- BLOCK 4 · A VOICE
     Drawn as a SLOT rather than filled, and that is the honest thing to do:
     the quotation belongs to a real person, and inventing one for a template —
     or lifting somebody’s words out of an article to decorate a demo — is the
     one placeholder that would read as finished work while being false.

     What the block fixes is the SHAPE: one quotation, one name, one line saying
     who they are, held to a reading measure in the middle of the field, and
     nothing else competing with it. -->
<section class="lnd-voice" aria-labelledby="voice-title">
  <div class="em-container">
    <h2 class="em-visually-hidden" id="voice-title">A voice from the campaign</h2>
    <figure class="lnd-quote" data-reveal-group>
      <blockquote class="lnd-quote__slot" data-placeholder="quote" data-reveal="rise">
        <p>One quotation from someone the campaign is about, in their own words.
          Two or three lines is the size that carries; longer and it stops being
          a voice and becomes another paragraph.</p>
      </blockquote>
      <figcaption class="lnd-quote__by" data-reveal="rise">
        <span class="lnd-quote__name">Their name</span>
        <span class="lnd-quote__role">Who they are, in six words</span>
      </figcaption>
    </figure>
  </div>
</section>
