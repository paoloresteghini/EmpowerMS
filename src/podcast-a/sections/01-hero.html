<!-- The roadmap’s hero gives a three-sentence headline, one paragraph and TWO
     buttons, plus a bracketed note: "(Include behind-the-scenes photos)".

     THE TWO BUTTONS. This build’s brand rule is one orange filled action per
     view, and a test enforces the count. Both buttons ship as copy; Watch on
     YouTube takes the fill because it is the roadmap’s first, and Listen Now
     takes the outline. Nothing is dropped.

     THE PHOTOGRAPHS DO NOT EXIST. Nothing in assets/photography is a studio,
     stage or event frame — the library is education, work and family stock. So
     the three frames here are marked placeholders at the aspect the real
     pictures will use, and the note says so in words. Inventing a "podcast
     studio" out of an unrelated stock photo would be worse than an empty box:
     it would look finished. -->
