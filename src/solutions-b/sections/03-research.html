<!-- The light panel climbs over the navy above it: a negative margin on the
     panel, which is a child of this section, so the section keeps its height.
     "Explore Research" goes to EPIC, which lives under /latest in this build. -->
<section class="sb-research" aria-labelledby="research-title">
  <div class="em-container">
    <div class="sb-research__panel" data-reveal-group>
      <div class="sb-research__head">
        <h2 id="research-title" data-reveal="rise">Research That Drives Solutions</h2>
        <p class="sb-research__lede" data-reveal="rise">Effective solutions start with understanding the problem.</p>
      </div>
      <div class="sb-research__body">
        <p data-reveal="rise">Our research examines the challenges facing Mississippi, identifies opportunities for improvement, and provides practical recommendations grounded in data and real-world experience.</p>
        <a class="em-btn em-btn--outline em-btn--md" href="/latest" data-reveal="rise">Explore Research</a>
      </div>
    </div>
  </div>
</section>
