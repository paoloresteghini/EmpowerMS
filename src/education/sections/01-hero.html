<!-- Dark hero, no photograph. The template’s whole idea is that the page starts
     dark and the light arrives in sections, so the first screen is the headline
     and nothing else. The glow behind it is a CSS gradient, not an image. -->
<section class="sol-hero" aria-labelledby="hero-title" data-reveal-entrance>
  <div class="em-container">
    <div class="sol-hero__inner" data-reveal-group>
      <p class="sol-eyebrow" data-reveal="rise">Quality Education</p>
      <h1 id="hero-title" data-reveal="rise">Every Child Deserves the <em>Opportunity to Succeed</em></h1>
    </div>
  </div>
</section>
