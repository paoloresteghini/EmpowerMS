<!-- BLOCK 1 · CAMPAIGN HERO
     Slots: eyebrow, headline, one paragraph, one action, one supporting link,
     one image — a photograph, a badge or a poster, whichever the campaign has.
     A campaign with no image deletes the column and the copy runs full width.

     ONE ORANGE ACTION. A landing page exists to be acted on, so unlike the All
     Content readings this one has a filled button, and only one. -->
<section class="lnd-hero" aria-labelledby="hero-title" data-reveal-entrance>
  <div class="em-container">
    <div class="lnd-hero__grid" data-reveal-group>
      <div class="lnd-hero__copy">
        <p class="lnd-eyebrow" data-reveal="rise">Campaign</p>
        <h1 id="hero-title" data-reveal="rise">Save Our ESA</h1>
        <p class="lnd-hero__lede" data-reveal="rise">Mississippi families with children who have special needs were being
          put on a waiting list for the education their child needed now.
          Not next year, not when a place opened up. Now.</p>
        <p class="lnd-hero__actions" data-reveal="rise">
          <a class="em-btn em-btn--primary em-btn--lg" href="#act">Contact your legislator</a>
          <a class="lnd-hero__aside" href="https://empowerms.org/waitlisted-again/">Read what the waitlist meant</a>
        </p>
      </div>

      <!-- A photograph, not the campaign’s own badge. Empower’s Save Our ESA
           artwork in the media library is an email mock-up whose body text is
           lorem ipsum, and a page carrying lorem ipsum in front of a client is
           not a template, it is an unfinished page. -->
      <div class="lnd-hero__mark" data-reveal="clip">
        <img src="../assets/photography/child-classroom-tablet.jpg"
             alt="A girl writing at a table in a brightly lit classroom"
             width="742" height="649" fetchpriority="high" decoding="async">
      </div>
    </div>
  </div>
</section>
