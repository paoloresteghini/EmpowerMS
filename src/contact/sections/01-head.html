<!-- Head. Same shape as the legal pages' head and for the same reason: this is
     a page you arrive at knowing what you want, so the title’s job is to
     confirm you are in the right place and get out of the way.

     "CONTACT US" on the old page is set in capitals by its stylesheet, not
     typed that way; the words are what carry over. The sentence under it is
     Empower’s own, verbatim from /contact/. -->
<section class="ct-head" aria-labelledby="contact-title">
  <div class="em-container">
    <div class="ct-head__inner" data-reveal-group>
      <h1 id="contact-title" data-reveal="rise">Contact Us</h1>
      <p class="ct-head__lead" data-reveal="rise">We’d love to hear from you! Use the form below to e-mail us.</p>
    </div>
  </div>
</section>
