<!-- Typographic hero: no photograph behind the words, no navy. The roadmap gives
     this page one hero line and this variation takes it at face value — the line
     is the whole screen, on white, with a rule under it.

     The picture arrives immediately AFTER the headline, window-wide, as the
     page’s one photograph. That order is the argument: read the sentence, then
     see who it is about. It is the black-and-white workplace frame, which is
     also what makes the near-monochrome claim of this variation literal.

     NOTE ON THE PHOTOGRAPHY: the filenames in assets/photography do not reliably
     describe their contents — young-man-portrait-bw.jpg is a colour classroom
     scene and family-outdoors-park.jpg is a boy reading in a library. Every
     image on these four pages was opened and checked before its alt text was
     written. Do not pick one by name. -->
<section class="wrb-hero" aria-labelledby="hero-title" data-reveal-entrance>
  <div class="em-container">
    <div class="wrb-hero__copy" data-reveal-group>
      <p class="wrb-eyebrow" data-reveal="rise">Meaningful Work</p>
      <h1 id="hero-title" data-reveal="rise">Work Should Open Doors to Opportunity</h1>
      <p class="wrb-hero__rule" aria-hidden="true" data-reveal="rise"></p>
    </div>
  </div>

  <figure class="wrb-hero__band" data-reveal="clip">
    <img src="../assets/photography/worker-workshop-bw.jpg" alt="A young man working at a computer in an open-plan office" width="918" height="620" fetchpriority="high" decoding="async">
  </figure>
</section>
