     than a rail per section. Four independent section-scoped timelines put a
     later section further along than an earlier one, which read as four
     progress bars instead of one line; a single element on the root scroll
     timeline is genuinely continuous. It is an absolutely positioned element,
     never a border-left.

     The wrapper exists because <main id="main"> is asserted verbatim across
     every page in this build — the skip link depends on it — so the positioning
     context cannot be main itself. -->
