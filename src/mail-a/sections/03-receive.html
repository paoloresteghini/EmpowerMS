<!-- What You’ll Receive. Four items, drawn as a ruled list against a photograph
     rather than as four identical cards. Each row carries a tick that draws
     itself as the row arrives, which is the only motion this page needs: it is
     a page about a short email, and a page that performs would contradict it.

     The photograph is a person the newsletter is written for, not an icon of
     one. No text is set over it. -->
<section class="mla-receive" aria-labelledby="receive-title">
  <div class="em-container mla-receive__grid">
    <div class="mla-receive__list-wrap">
      <h2 class="mla-receive__title" id="receive-title" data-reveal="rise">What You’ll Receive</h2>

      <ul class="mla-receive__list" data-reveal-group>
        <li class="mla-item" data-reveal="rise">
          <svg class="mla-item__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path d="M4 12.5 L9.5 18 L20 6.5" pathLength="1"/>
          </svg>
          Monthly news and updates
        </li>
        <li class="mla-item" data-reveal="rise">
          <svg class="mla-item__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path d="M4 12.5 L9.5 18 L20 6.5" pathLength="1"/>
          </svg>
          Legislative highlights during the session
        </li>
        <li class="mla-item" data-reveal="rise">
          <svg class="mla-item__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path d="M4 12.5 L9.5 18 L20 6.5" pathLength="1"/>
          </svg>
          New articles, research, and podcasts
        </li>
        <li class="mla-item" data-reveal="rise">
          <svg class="mla-item__tick" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path d="M4 12.5 L9.5 18 L20 6.5" pathLength="1"/>
          </svg>
          Opportunities to get involved
        </li>
      </ul>

      <p class="mla-receive__back"><a href="#signup">Back to the sign-up form</a></p>
    </div>

    <figure class="mla-receive__figure" data-reveal="clip">
      <img src="../assets/photography/children-running-parent.jpg" width="1243" height="1578"
           loading="lazy" decoding="async"
           alt="A man playing football with two children in a field at sunset.">
    </figure>
  </div>
</section>
