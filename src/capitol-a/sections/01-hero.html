<!-- The roadmap gives this page ONE button, not two: Capitol Chat is an audio show
     ("listen and subscribe wherever you get your podcasts", "audio players"),
     where The Empower Podcast leads on YouTube. So there is no video affordance
     anywhere on this page, and Listen Now is the page’s single orange action.

     A centred hero, which nothing else in this build uses: the headline is a
     question, and a question set centred reads as one being asked rather than one
     being answered.

     "(Include capital photos)" — the Capitol. Nothing in assets/photography is
     the Capitol, a legislature, or any interior architecture, so the triptych
     below the copy is three marked placeholders at the shape the real frames will
     take. -->
<section class="cca-hero" aria-labelledby="hero-title" data-reveal-entrance>
  <div class="em-container">
    <div class="cca-hero__copy" data-reveal-group>
      <p class="cca-eyebrow" data-reveal="rise">Capitol Chat</p>
      <h1 id="hero-title" data-reveal="rise">What’s Happening Under the Dome?</h1>
      <p class="cca-hero__lede" data-reveal="rise">Get quick, straightforward updates on the legislation, debates, and decisions shaping Mississippi during the legislative session.</p>
      <p class="cca-hero__action" data-reveal="rise">
        <a class="em-btn em-btn--primary em-btn--lg" href="/podcast">Listen Now</a>
      </p>
    </div>
  </div>

  <div class="em-container">
    <ul class="cca-triptych" data-reveal-group>
      <li class="cca-plate" data-placeholder="photo" data-reveal="rise"><span>Capitol photography to come</span></li>
      <li class="cca-plate" data-placeholder="photo" data-reveal="rise" aria-hidden="true"></li>
      <li class="cca-plate" data-placeholder="photo" data-reveal="rise" aria-hidden="true"></li>
    </ul>
  </div>
</section>
