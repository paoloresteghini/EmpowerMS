<!-- Stay Informed, Not Overwhelmed. A navy band with the heading held on the
     left and the argument set as one column on the right, so the three short
     roadmap paragraphs read as a single passage instead of three equal blocks.

     The middle sentence is pulled out at display size, because it is the only
     one of the three that says what the emails actually are. -->
<section class="mlb-about" aria-labelledby="about-title">
  <div class="em-container mlb-about__grid">
    <!-- The break is followed by a newline on purpose: the copy sweep reads the
         page with its tags removed, and “Informed,<br>Not” with nothing between
         them collapses into one word there. -->
    <h2 class="mlb-about__title" id="about-title" data-reveal="rise">Stay Informed,<br>
      Not Overwhelmed</h2>

    <div class="mlb-about__say" data-reveal-group>
      <p data-reveal="rise">Keeping up with what’s happening shouldn’t feel like another full-time job.</p>
      <p class="mlb-about__pull" data-reveal="rise">Our emails bring you the highlights—clear, concise, and easy to read in just a few minutes.</p>
      <p data-reveal="rise">No clutter. No inbox overload. Just practical updates when they matter most.</p>
    </div>
  </div>
</section>
