<!-- One narrow column, centred. The vision is the only place on this variation
     where the measure narrows: it is a statement of belief, and it is set the way
     a statement of belief is set. -->
<section class="wrb-vision" aria-labelledby="vision-title">
  <div class="em-container">
    <div class="wrb-vision__inner" data-reveal-group>
      <h2 id="vision-title" data-reveal="rise">What Does Meaningful Work Look Like?</h2>
      <p class="wrb-vision__lede" data-reveal="rise">Every Mississippian should have the opportunity to earn success, provide for their family, and find purpose through meaningful work.</p>
      <p data-reveal="rise">That means creating more pathways to good careers and an environment where people and businesses can thrive.</p>
    </div>
  </div>
</section>
