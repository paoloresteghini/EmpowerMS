<!-- Names and the two officer roles are the roadmap’s copy. Grant Callen appears
     here and in the staff roster because he sits on both.

     THE HEADSHOTS ARE EMPOWER’S OWN, taken from empowerms.org/board/. Their page
     pairs each photograph with its own name in its own markup, and that pairing
     is what identifies them, because two of the eight files are named after
     somebody else: `Betsy-Acklen-…` sits under the heading “Betsy Dowell” (a
     former name) and `G-Gilbert-…` under “Gerard Gibert” (their own
     misspelling). Grant Callen’s file is called `2`. Every one of the eight also
     carries `-circle-` in its filename, which describes the CSS their page
     applies and not the file: all eight are plain square photographs.

     RE-PULLED AT SOURCE SIZE ON 2026-09-16, and cropped to the 4:5 the card
     wants. The earlier copies were downscaled to 132px because that was the size
     the disc rendered at, which made this change look as though it needed new
     assets from Empower; it did not. Sources ran 400 to 1422px square, so the
     crop takes the full height and trims the sides, and nothing here is upscaled.
     Marie Sanderson’s is the smallest at 320x400 and is the one to replace first
     if Empower ever send a larger set.

     ALT IS EMPTY AND aria-hidden STAYS, exactly as it was on the discs these
     replace. The person’s name is the next element in the same card, so a
     described photograph would make a screen reader announce every board member
     twice.

     CARDS SINCE 2026-09-16, Grant’s round 2: “make the Board into cards like the
     staff and the same size as the Staff cards”. So the section reuses
     `.ta-roster` and `.ta-person` rather than copying their measurements, which
     is what makes “the same size” true by construction rather than by a number
     typed twice. The photograph takes `.ta-headshot` and NOT `.ta-portrait`:
     `.ta-portrait` is the staff tile’s placeholder treatment, a dashed edge and a
     hex lattice, and it is only turned into a picture frame in bridge.css, which
     the static build does not load. `.ta-headshot` is a real frame in both. -->
<section class="ta-board" aria-labelledby="board-title">
  <div class="em-container">
    <div class="ta-board__head ta-mark" data-reveal-group>
      <h2 id="board-title" data-reveal="rise">Board of Directors</h2>
    </div>

    <ul class="ta-roster" data-reveal-group>
      <li class="ta-person" data-reveal="rise">
        <div class="ta-person__link">
          <img class="ta-headshot" src="../assets/headshots/abb-payne.jpg" width="400" height="500"
               loading="lazy" decoding="async" alt="" aria-hidden="true">
          <h3 class="ta-person__name">Abb Payne</h3>
          <span class="ta-person__title">Chairman</span>
        </div>
      </li>
      <li class="ta-person" data-reveal="rise">
        <div class="ta-person__link">

               loading="lazy" decoding="async" alt="" aria-hidden="true">
          <h3 class="ta-person__name">Gerard Gibert</h3>
          <span class="ta-person__title">Treasurer</span>
        </div>
      </li>
      <li class="ta-person" data-reveal="rise">
        <div class="ta-person__link">

      </li>
      <li class="ta-person" data-reveal="rise">

      </li>
      <li class="ta-person" data-reveal="rise">

               loading="lazy" decoding="async" alt="" aria-hidden="true">
          <h3 class="ta-person__name">Betsy Dowell</h3>
        </div>
      </li>
      <li class="ta-person" data-reveal="rise">
        <div class="ta-person__link">
          <img class="ta-headshot" src="../assets/headshots/lex-lindsey.jpg" width="400" height="500"
               loading="lazy" decoding="async" alt="" aria-hidden="true">
          <h3 class="ta-person__name">Lex Lindsey</h3>
        </div>
      </li>
      <li class="ta-person" data-reveal="rise">

               loading="lazy" decoding="async" alt="" aria-hidden="true">
          <h3 class="ta-person__name">Marie Sanderson</h3>
        </div>
      </li>
      <li class="ta-person" data-reveal="rise">
        <div class="ta-person__link">
          <img class="ta-headshot" src="../assets/headshots/george-williams.jpg" width="400" height="500"
               loading="lazy" decoding="async" alt="" aria-hidden="true">
          <h3 class="ta-person__name">George Williams</h3>
        </div>
      </li>
    </ul>
  </div>
</section>
