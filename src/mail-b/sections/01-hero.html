<!-- Hero. The opposite bet to reading A: the form is the destination, not the
     opening, so the page has room to be a piece of publishing before it asks
     for an address. It opens on a photograph the width of the window, with the
     title on solid ground beneath it — the image is never a mat for type.

     The hero button is a link to the form at the foot of the page. The page’s
     single orange action is the submit down there; a filled button here would
     be a second one, and it would also be the weaker of the two. -->
<section class="mlb-hero" aria-labelledby="mail-title">
  <div class="mlb-hero__band" data-reveal="clip">
    <img src="../assets/photography/children-running-parent.jpg" width="1243" height="1578"
         loading="eager" fetchpriority="high" decoding="async"
         alt="A man playing football with two children in a field at sunset.">
  </div>

  <div class="em-container mlb-hero__plate">
    <h1 class="mlb-hero__title" id="mail-title">Stay Connected</h1>
    <div class="mlb-hero__say">
      <p class="mlb-hero__lead">Get the latest from Empower Mississippi delivered straight to your inbox.</p>
      <p class="mlb-hero__sub">From monthly updates to important news from the Capitol, we’ll help you stay informed in five minutes or less.</p>
      <p class="mlb-hero__act"><a class="em-btn em-btn--outline em-btn--lg" href="#signup">Join Our Email List</a></p>
    </div>
  </div>
</section>
