<!-- The inverse of work-c’s hero: instead of a navy field with a photograph inset
     into it, ONE navy plate sits on white, and the photograph is a column inside
     that plate, flush to its edge and clipped by its radius. No word is on the
     picture.

     The rail to the four work areas sits under the plate on white, divided by
     hairlines — work-c’s runs along the navy’s bottom edge instead. Real anchors,
     the roadmap’s own labels, and each target carries scroll-margin so the sticky
     header does not cover the heading it jumps to. -->
<section class="sfc-hero" aria-labelledby="hero-title" data-reveal-entrance>
  <div class="em-container">
    <div class="sfc-hero__plate">
      <div class="sfc-hero__copy" data-reveal-group>
        <p class="sfc-hero__eyebrow" data-reveal="rise">Public Safety</p>
        <h1 id="hero-title" data-reveal="rise">Every Mississippian Deserves to Feel Safe at Home</h1>
      </div>

      <figure class="sfc-hero__media" data-reveal="clip">
        <img src="../assets/photography/grandparents-grandchild.jpg" alt="A man with a small child on his shoulders and a woman beside them, crouching on the grass in a park" width="922" height="617" fetchpriority="high" decoding="async">
      </figure>
    </div>

    <nav class="sfc-rail" aria-label="The four areas of this work">
      <ul>
        <li><a href="#area-prevention">Crime Prevention &amp; Public Safety</a></li>
        <li><a href="#area-justice">Effective Justice</a></li>
        <li><a href="#area-reentry">Second Chances &amp; Reentry</a></li>
        <li><a href="#area-families">Strong Families &amp; Communities</a></li>
      </ul>
    </nav>
  </div>
</section>
