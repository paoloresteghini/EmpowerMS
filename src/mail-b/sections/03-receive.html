<!-- What You’ll Receive. A contents page, not a checklist: the four things are
     set at display size on full-width ruled lines, the way a masthead lists
     what is inside an issue. That is the difference from reading A, where the
     same four items are a tick list beside a photograph.

     The rule above each line grows to full width as the row arrives — scroll
     driven, no script, and simply drawn where that is unsupported. -->
<section class="mlb-receive" aria-labelledby="receive-title">
  <div class="em-container">
    <h2 class="mlb-receive__title" id="receive-title" data-reveal="rise">What You’ll Receive</h2>

    <ul class="mlb-index">
      <li class="mlb-index__row">
        <span class="mlb-index__rule" aria-hidden="true"></span>
        <span class="mlb-index__text">Monthly news and updates</span>
      </li>
      <li class="mlb-index__row">
        <span class="mlb-index__rule" aria-hidden="true"></span>
        <span class="mlb-index__text">Legislative highlights during the session</span>
      </li>
      <li class="mlb-index__row">
        <span class="mlb-index__rule" aria-hidden="true"></span>
        <span class="mlb-index__text">New articles, research, and podcasts</span>
      </li>
      <li class="mlb-index__row">
        <span class="mlb-index__rule" aria-hidden="true"></span>
        <span class="mlb-index__text">Opportunities to get involved</span>
      </li>
    </ul>
  </div>
</section>
